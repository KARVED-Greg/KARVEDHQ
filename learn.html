@font-face {

:root {
  --bg: #0A0D17;

  --navy: #0D1129;
  --text-light: rgba(255,255,255,0.92);

* { margin: 0; padding: 0; box-sizing: border-box; }
body {

  color: var(--text-light);

.wrap { max-width: 820px; margin: 0 auto; padding: 30px 20px 70px; text-align: center; }

.logo { display: inline-block; margin-bottom: 26px; }
.logo img { width: 190px; max-width: 55vw; height: auto; display: block; }

.banner {
  display: inline-flex; align-items: center; gap: 9px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 11px 22px;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.6px; text-transform: uppercase;
  color: var(--text-light);
  margin-bottom: 34px; line-height: 1.4;
}
.banner::before {
  content: ''; width: 9px; height: 9px; border-radius: 50%;
  background: #E5484D; flex-shrink: 0;
  box-shadow: 0 0 10px rgba(229,72,77,0.7);
}

h1 {
  font-family: 'Norwester', sans-serif; font-weight: normal;

  letter-spacing: 0.5px; text-transform: uppercase;
  color: #FFFFFF; margin-bottom: 34px;
}

/* Transformation collage + play button */
.collage {
  position: relative; cursor: pointer;
  max-width: 780px; margin: 0 auto 32px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px;
  background: #05070D; border-radius: 10px; overflow: hidden;
}
.collage img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 3 / 4; display: block; }
.collage::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,13,23,0.15), rgba(10,13,23,0.45));
}
.collage .play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 92px; height: 92px; border-radius: 50%;
  background: rgba(255,255,255,0.94);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 44px rgba(0,0,0,0.55);
  transition: transform 0.2s ease; z-index: 2;
}
.collage:hover .play { transform: translate(-50%, -50%) scale(1.07); }
.collage .play::after {
  content: ''; width: 0; height: 0;
  border-left: 27px solid #0A0D17;
  border-top: 16px solid transparent;
  border-bottom: 16px solid transparent;
  margin-left: 7px;
}

/* CTA button */
.cta-btn {
  display: block; width: 100%; max-width: 700px; margin: 0 auto;
  background: linear-gradient(135deg, #C4A44A, #E8D5A3);
  color: #1A1A1A; border: none; cursor: pointer;
  border-radius: 12px; padding: 22px 24px;
  font-family: 'Norwester', sans-serif;
  font-size: clamp(22px, 3.6vw, 32px); letter-spacing: 1px;
  text-transform: uppercase; line-height: 1.1;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 10px 40px rgba(196,164,74,0.22);
}
.cta-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 52px rgba(196,164,74,0.38); }
.cta-btn small {
  display: block; margin-top: 6px;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: rgba(26,26,26,0.7);
}

@media (max-width: 600px) {
  .banner { font-size: 10.5px; padding: 10px 16px; }
  .collage .play { width: 68px; height: 68px; }
  .collage .play::after { border-left-width: 20px; border-top-width: 12px; border-bottom-width: 12px; }
}
