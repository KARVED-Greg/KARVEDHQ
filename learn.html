<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARVED | Free Access to the Comeback Program</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pmpi-quiz.css">
<style>
@font-face {
  font-family: 'Norwester';
  src: url('https://cdn.jsdelivr.net/gh/AugustRush/font@master/Norwester-Regular.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'Astrid Grotesk';
  src: url('astrid-grotesk-hv-cn.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}
:root {
  --bg: #0A0D17;
  --gold: #C4A44A;
  --gold-light: #E8D5A3;
  --navy: #0D1129;
  --text-light: rgba(255,255,255,0.92);
  --text-mid: rgba(255,255,255,0.55);
  --border: rgba(255,255,255,0.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Montserrat', sans-serif;
  background: var(--bg);
  color: var(--text-light);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5; min-height: 100vh;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 30px 20px 70px; text-align: center; }

.logo { display: inline-block; margin-bottom: 7px; }
.logo img { height: 56px; width: auto; max-width: 82vw; display: block; }

.banner {
  display: flex; align-items: center; gap: 9px;
  width: max-content; max-width: 100%;
  margin-left: auto; margin-right: auto;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 11px 26px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--text-light);
  margin-bottom: 8px; line-height: 1.4;
  cursor: pointer; transition: border-color 0.2s ease;
}
.banner:hover { border-color: var(--gold); }
.banner::before {
  content: ''; width: 9px; height: 9px; border-radius: 50%;
  background: #E5484D; flex-shrink: 0;
  box-shadow: 0 0 10px rgba(229,72,77,0.7);
}

h1 {
  font-family: 'Astrid Grotesk', 'Norwester', sans-serif; font-weight: normal;
  font-size: clamp(32px, 6vw, 56px); line-height: 1;
  letter-spacing: 0; text-transform: uppercase; text-wrap: balance;
  color: #FFFFFF; margin-bottom: 8px;
}

/* Step 1 gold bar (above collage) */
.step-bar {
  background: linear-gradient(135deg, #C4A44A, #E8D5A3);
  color: #0A0D17;
  font-weight: 700; font-size: 14px;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 14px 20px;
  border-radius: 10px 10px 0 0;
  max-width: 820px; margin: 0 auto;
}

/* Transformation collage + play button */
.collage {
  position: relative; cursor: pointer;
  max-width: 820px; margin: 0 auto 8px;
  background: #05070D; border-radius: 0 0 10px 10px; overflow: hidden;
}
.collage img { width: 100%; height: auto; display: block; }
.collage::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,13,23,0.15), rgba(10,13,23,0.45));
}
.collage .play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 92px; height: 92px; border-radius: 50%;
  background: rgba(255,255,255,0.94);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 44px rgba(0,0,0,0.55);
  transition: transform 0.2s ease; z-index: 2;
}
.collage:hover .play { transform: translate(-50%, -50%) scale(1.07); }
.collage .play::after {
  content: ''; width: 0; height: 0;
  border-left: 27px solid #0A0D17;
  border-top: 16px solid transparent;
  border-bottom: 16px solid transparent;
  margin-left: 7px;
}

/* Step 2 cue */
.step2 {
  margin-top: 0; margin-bottom: 12px;
  font-size: 17px; font-weight: 600;
  color: var(--text-light); line-height: 1.5;
}

/* CTA button */
.cta-btn {
  display: block; width: 100%; max-width: 700px; margin: 0 auto;
  background: linear-gradient(135deg, #C4A44A, #E8D5A3);
  color: #000000; border: none; cursor: pointer;
  border-radius: 12px; padding: 12px 28px;
  font-family: 'Astrid Grotesk', 'Norwester', sans-serif;
  font-size: clamp(24px, 4vw, 36px); letter-spacing: 0.5px;
  text-transform: uppercase; line-height: 1.05;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 10px 40px rgba(196,164,74,0.22);
}
.cta-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 52px rgba(196,164,74,0.38); }
.cta-btn small {
  display: block; margin-top: 6px;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase; color: rgba(0,0,0,0.72);
}

@media (max-width: 720px) {
  .banner { white-space: normal; }
}
@media (max-width: 600px) {
  .wrap { padding: 16px 16px 50px; }
  .logo { margin-bottom: 4px; }
  .logo img { height: 44px; }
  .banner { font-size: 10.5px; padding: 8px 14px; }
  .step-bar { font-size: 11.5px; padding: 9px 14px; letter-spacing: 0.4px; white-space: nowrap; overflow: hidden; }
  .step2 { font-size: 12.5px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; }
  .cta-btn { font-size: 22px; padding: 10px 14px; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; }
  .cta-btn small { font-size: 9.5px; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; }
  .collage .play { width: 68px; height: 68px; }
  .collage .play::after { border-left-width: 20px; border-top-width: 12px; border-bottom-width: 12px; }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="banner" onclick="PMPI.open()">Learn how 100+ guys have become peak performers with the KARVED system</div>

    Performance standards quiz

</div>
